<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<title>EVOLSIOR Dashboard</title>
<style>
  :root { color-scheme: dark; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #09090B; color: #FAFAFA; font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { max-width: 420px; padding: 24px; display: grid; gap: 14px; text-align: center; justify-items: center; }
  svg { width: 40px; height: 40px; }
  h1 { margin: 0; font-size: 22px; letter-spacing: -.02em; }
  p { margin: 0; color: #8B8B95; }
  button { height: 44px; padding: 0 22px; border-radius: 10px; border: 0; background: #FAFAFA; color: #09090B; font: 500 15px system-ui, sans-serif; cursor: pointer; }
  button:focus-visible { outline: 2px solid #FAFAFA; outline-offset: 3px; }
</style>
</head>
<body>
<main>
  <svg viewBox="0 0 32 32" fill="currentColor" aria-hidden="true"><rect x="10" y="5" width="18" height="5" rx="2.5"/><rect x="4" y="13.5" width="18" height="5" rx="2.5"/><rect x="10" y="22" width="18" height="5" rx="2.5"/></svg>
  <h1>No connection</h1>
  <p>The dashboard could not be reached. Check your internet connection and try again.</p>
  <button type="button" id="retry" autofocus>Try again</button>
</main>
<script>
  var url = new URLSearchParams(location.search).get('url') || 'https://dashboard.evolsior.com';
  document.getElementById('retry').addEventListener('click', function () { location.href = url; });
  setTimeout(function () { location.href = url; }, 30000);
</script>
</body>
</html>
